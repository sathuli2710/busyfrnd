name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: busyfrnd, POSTGRES_PASSWORD: busyfrnd, POSTGRES_DB: busyfrnd }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U busyfrnd" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://busyfrnd:busyfrnd@localhost:5432/busyfrnd
      JWT_SECRET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @busyfrnd/api prisma:generate
      - run: pnpm typecheck
      - run: pnpm test
      - name: Apply migrations + seed + API smoke test
        run: |
          pnpm --filter @busyfrnd/api prisma:deploy
          pnpm --filter @busyfrnd/api prisma:seed
          pnpm --filter @busyfrnd/api build
          (cd apps/api && node dist/main.js &) ; sleep 6
          bash scripts/smoke.sh
      - name: Build websites
        run: pnpm --filter @busyfrnd/customer-web --filter @busyfrnd/vendor-web --filter @busyfrnd/admin-web build
      - name: Bundle check (Metro, both mobile apps)
        run: |
          pnpm --filter @busyfrnd/customer-mobile bundle:check
          pnpm --filter @busyfrnd/vendor-mobile bundle:check
