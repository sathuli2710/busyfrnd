services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: busyfrnd
      POSTGRES_PASSWORD: busyfrnd
      POSTGRES_DB: busyfrnd
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://busyfrnd:busyfrnd@postgres:5432/busyfrnd
      JWT_SECRET: change-me
    depends_on: [postgres]
    ports: ["4000:4000"]
    profiles: ["full"]
volumes:
  pgdata:
